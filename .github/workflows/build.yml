name: Build AetherOS for Nintendo DSi
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Verify devkitPro NDS toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          test -f "$DEVKITARM/ds_rules"
          test -f "$DEVKITPRO/libnds/lib/libnds9.a"
      - name: Build
        run: make
      - name: Gateway protocol HIL test
        run: |
          python3 tools/test_gateway_protocol.py
      - name: Pass 5 structural verification
        run: |
          test -f source/network/gateway_manager.cpp
          test -f source/core/diagnostics.cpp
          grep -q "GATE_QPU" source/network/gateway_manager.h
          grep -q "HIL" source/ui/aether_ui.cpp
          grep -q "fft128" source/dsp/aether_dsp.h
          test -f source/studio/aether_studio.cpp
      - name: Verify
        run: |
          test -s AETHEROS.nds
          file AETHEROS.nds || true
          ls -lh AETHEROS.nds
      - uses: actions/upload-artifact@v4
        with:
          name: AETHEROS-NDS
          path: AETHEROS.nds
