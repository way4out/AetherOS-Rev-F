name: Build AetherOS REVOLUTION X for Nintendo DSi
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Verify devkitPro NDS toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          test -f "$DEVKITARM/ds_rules"
          test -f "$DEVKITPRO/libnds/lib/libnds9.a"
      - name: Build
        run: |
          set +e
          make > build.log 2>&1
          rc=$?
          cat build.log
          echo "MAKE_RC=$rc"
          ls -lh AETHEROS.elf AETHEROS.nds 2>/dev/null || true
          exit $rc
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AETHEROS-build-diagnostics
          path: build.log
      - name: Gateway protocol HIL test
        run: |
          python3 tools/test_gateway_protocol.py
      - name: Rev7+ Pass 3 structural verification
        run: |
          test -f source/network/gateway_manager.cpp
          test -f source/core/diagnostics.cpp
          grep -q "GATE_QPU" source/network/gateway_manager.h
          grep -q "HIL" source/ui/aether_ui.cpp
          grep -q "fft128" source/dsp/aether_dsp.h
          test -f source/studio/aether_studio.cpp
          test -f source/settings/aether_settings.cpp
          test -f source/theme/aether_theme.cpp
          grep -q "MOD_SETTINGS" source/core/aether_core.h
          grep -q "SETTINGS.CFG" source/settings/aether_settings.cpp
          test -f source/security/aether_security_lab.cpp
          grep -q "TX LOCKED" source/ui/aether_ui.cpp
          grep -q "credentialCaptureLocked" source/security/aether_security_lab.h
          test -f source/core/mission_control.cpp
          grep -q "MISSION CONTROL" source/ui/aether_ui.cpp
          grep -q "mission::tick" source/core/aether_core.cpp
          test -f source/core/capacity_engine.cpp
          grep -q "1126" source/core/capacity_engine.cpp
          grep -q "AETHEROS REVOLUTION X" source/ui/aether_ui.cpp
          grep -q "1.1GB CLASS WORKSPACE READY" source/core/capacity_engine.cpp
          test -f source/i18n/aether_i18n.cpp
          test -f source/i18n/aether_i18n.h
          test -f source/animal/aether_animal.cpp
          test -f source/animal/aether_animal.h
          grep -q "LANG_ZH" source/i18n/aether_i18n.h
          grep -q "LANG_AR" source/i18n/aether_i18n.h
          grep -q "LANG_SIGN_ASL" source/i18n/aether_i18n.h
          grep -q "MOD_ANIMAL" source/core/aether_core.h
          grep -q "MOD_CODEX" source/core/aether_core.h
          grep -q "MOD_HARMONIC" source/core/aether_core.h
          test -f source/codex/aether_yhwh_codex.cpp
          test -f source/codex/aether_yhwh_codex.h
          test -f source/harmonic/aether_prime_harmonic.cpp
          test -f source/harmonic/aether_prime_harmonic.h
          test -f "assets/nitrofs/REVF/BIBLIO/YHWH-CODEX/Revelations"
          grep -q "REVOLUTION_INVARIANT" source/codex/aether_yhwh_codex.h
          grep -q "PRIME NUMERICAL HARMONIC NODE" source/ui/aether_ui.cpp
          grep -q "AETHER UNIVERSAL COMMUNICATION" source/ui/aether_ui.cpp
          grep -q "aether_i18n.o" Makefile
          grep -q "aether_animal.o" Makefile
          grep -q "aether_yhwh_codex.o" Makefile
          grep -q "aether_prime_harmonic.o" Makefile
          grep -q "assets/nitrofs" Makefile
          ! grep -R "HOBBIT" source README.md || true
          grep -q "mission_control.o" Makefile
      - name: Verify
        run: |
          test -s AETHEROS.nds
          file AETHEROS.nds || true
          ls -lh AETHEROS.nds
      - uses: actions/upload-artifact@v4
        with:
          name: AETHEROS-NDS
          path: AETHEROS.nds
