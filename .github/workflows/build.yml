name: Build AetherOS for Nintendo DSi
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Verify
        run: test -s AETHEROS.nds
      - uses: actions/upload-artifact@v4
        with:
          name: AETHEROS-NDS
          path: AETHEROS.nds
