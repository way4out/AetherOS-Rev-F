name: Build AetherOS QuantumAetherOSQ FunCore
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build NDS
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          command -v arm-none-eabi-gcc
          command -v arm-none-eabi-ld
          make clean
          make
          test -f QuantumAetherOSQ.nds
          file QuantumAetherOSQ.nds || true
          ls -lh QuantumAetherOSQ.nds
      - name: Package plug-and-play SD bundle
        run: |
          mkdir -p deploy/apps/QuantumAetherOSQ
          cp QuantumAetherOSQ.nds deploy/apps/QuantumAetherOSQ/QuantumAetherOSQ.nds
          printf '%s\n' 'Copy apps/QuantumAetherOSQ/QuantumAetherOSQ.nds to the SD card.' > deploy/INSTALL.txt
          cd deploy
          zip -r ../AetherOS-QuantumAetherOSQ-FunCore-DSi.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AetherOS-QuantumAetherOSQ-FunCore-DSi
          path: |
            QuantumAetherOSQ.nds
            AetherOS-QuantumAetherOSQ-FunCore-DSi.zip
