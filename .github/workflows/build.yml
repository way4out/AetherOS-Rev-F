name: Build AetherMod 5.0 Genesis for Nintendo DSi
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build AetherMod
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          make
          test -f AetherMod.nds
          file AetherMod.nds || true
          ls -lh AetherMod.nds
      - name: Package complete SD bundle
        run: |
          mkdir -p deploy/apps/AetherMod
          mkdir -p deploy/data/AetherMod
          cp AetherMod.nds deploy/apps/AetherMod/AetherMod.nds
          cp -r data/AetherMod/. deploy/data/AetherMod/
          cp AETHERMOD.md deploy/AETHERMOD.md
          printf '%s\n' 'Copy the apps/AetherMod and data/AetherMod directories to the DSi SD card.' > deploy/INSTALL.txt
          cd deploy
          zip -r ../AetherMod-5.0-Genesis-Pass1-DSi-Full-Rollout.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: AetherMod-5.0-Genesis-Pass1-DSi-Full-Rollout
          path: |
            AetherMod.nds
            AetherMod-DSi-Full-Rollout.zip
