name: Build O2S2HaHa DSi
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - uses: actions/checkout@v4
      - name: Build NDS
        run: |
          make clean
          make
          test -f O2S2HaHa.nds
          ls -lh O2S2HaHa.nds
      - name: Package
        run: |
          mkdir -p deploy/apps/O2S2HaHa
          cp O2S2HaHa.nds deploy/apps/O2S2HaHa/O2S2HaHa.nds
          cd deploy
          zip -r ../O2S2HaHa-DSi-NextGen.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: O2S2HaHa-DSi-NextGen
          path: |
            O2S2HaHa.nds
            O2S2HaHa-DSi-NextGen.zip
